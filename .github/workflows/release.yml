name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build & Release (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Windows Installers (NSIS & MSI)
        run: npm run tauri:build-win

      - name: Build Portable Package
        run: npm run build:portable

      - name: Prepare Standalone Exe
        shell: pwsh
        run: |
          Copy-Item "src-tauri/target/release/digital-wellbeing.exe" -Destination "dist-portable/DigitalWellbeing.exe"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: DigitalWellbeing ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## DigitalWellbeing Enterprise ${{ github.ref_name }}

            Enterprise wellbeing monitoring agent for Windows PCs and LAN Admin Dashboard.

            ### Downloads
            | File | Description |
            |---|---|
            | `DigitalWellbeing_*_x64-setup.exe` | Standard Windows Setup Installer |
            | `DigitalWellbeing_*_x64_en-US.msi` | Windows MSI Installer (Enterprise GPO / AD deployment) |
            | `DigitalWellbeing.exe` | Standalone Agent executable (single file) |
            | `DigitalWellbeing-portable-*.zip` | Complete portable bundle (Agent + Admin Dashboard + README) |
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            dist-portable/DigitalWellbeing.exe
            dist-portable/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
